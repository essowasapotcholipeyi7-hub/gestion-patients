{% extends "base.html" %}

{% block title %}Modifier un Protocole{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">
                        Modifier le Protocole
                    </h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nom du protocole <span class="text-danger">*</span></label>
                            <input type="text" name="nom" class="form-control" 
                                   value="{{ protocole.nom }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Description / Etapes <span class="text-danger">*</span></label>
                            <textarea name="description" class="form-control" rows="6" required>{{ protocole.description }}</textarea>
                            <small class="text-muted">Decrivez les etapes du protocole (une etape par ligne).</small>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Ordonnance associee</label>
                                <select name="ordonnance_type_id" class="form-select">
                                    <option value="">-- Aucune --</option>
                                    {% for o in ordonnances %}
                                    <option value="{{ o.id }}" {% if protocole.ordonnance_type_id == o.id %}selected{% endif %}>
                                        {{ o.nom }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Examens associes</label>
                                <select name="examen_type_id" class="form-select">
                                    <option value="">-- Aucun --</option>
                                    {% for e in examens %}
                                    <option value="{{ e.id }}" {% if protocole.examen_type_id == e.id %}selected{% endif %}>
                                        {{ e.nom }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="actif" name="actif" {% if protocole.actif %}checked{% endif %}>
                                <label class="form-check-label" for="actif">
                                    <span class="badge bg-success">Actif</span>
                                    Le protocole est disponible pour les hospitalisations
                                </label>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('liste_protocoles') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Annuler
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Enregistrer les modifications
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
