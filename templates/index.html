{% extends "base.html" %}

{% block content_public %}
<style>
    .hero-section {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 55%, #1e2a4a 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
    }

    .hero-section::before {
        content: '';
        position: absolute;
        top: -40%;
        right: -15%;
        width: 650px;
        height: 650px;
        background: radial-gradient(circle, rgba(102, 126, 234, 0.25) 0%, transparent 70%);
        border-radius: 50%;
        animation: heroFloat 9s ease-in-out infinite;
    }

    .hero-section::after {
        content: '';
        position: absolute;
        bottom: -30%;
        left: -12%;
        width: 480px;
        height: 480px;
        background: radial-gradient(circle, rgba(118, 75, 162, 0.22) 0%, transparent 70%);
        border-radius: 50%;
        animation: heroFloat 11s ease-in-out infinite reverse;
    }

    @keyframes heroFloat {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(30px, -30px) scale(1.05); }
    }

    .hero-card {
        background: rgba(255,255,255,0.97);
        border: none;
        border-radius: 24px;
        box-shadow: 0 25px 70px rgba(0,0,0,0.35);
        position: relative;
        z-index: 1;
        transition: transform 0.3s ease;
    }

    .hero-card:hover { transform: translateY(-4px); }

    .hero-icon {
        width: 80px;
        height: 80px;
        background: var(--hp-sidebar-bg-active);
        border-radius: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
        box-shadow: 0 10px 32px rgba(102, 126, 234, 0.4);
    }

    .hero-icon i { font-size: 2.5rem; color: #fff; }

    .hero-title {
        font-size: 2.8rem;
        font-weight: 800;
        color: var(--hp-text);
        letter-spacing: -0.5px;
        margin-bottom: 0.5rem;
    }

    .hero-title span {
        background: var(--hp-sidebar-bg-active);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .hero-subtitle {
        font-size: 1.15rem;
        color: var(--hp-text-muted);
        font-weight: 400;
        max-width: 450px;
        margin: 0 auto 2rem;
        line-height: 1.7;
    }

    .btn-hero-primary {
        background: var(--hp-sidebar-bg-active);
        border: none;
        padding: 0.9rem 2.5rem;
        border-radius: 16px;
        font-weight: 600;
        font-size: 1.05rem;
        color: #fff;
        transition: all 0.3s ease;
        box-shadow: 0 10px 32px rgba(102, 126, 234, 0.4);
        width: 100%;
    }

    .btn-hero-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 42px rgba(102, 126, 234, 0.5);
        color: #fff;
    }

    .btn-hero-secondary {
        background: transparent;
        border: 2px solid var(--hp-card-border);
        padding: 0.9rem 2.5rem;
        border-radius: 16px;
        font-weight: 600;
        font-size: 1.05rem;
        color: var(--hp-text-muted);
        transition: all 0.3s ease;
        width: 100%;
    }

    .btn-hero-secondary:hover {
        background: var(--hp-primary-light);
        border-color: var(--hp-primary);
        color: var(--hp-primary);
        transform: translateY(-2px);
    }

    .hero-features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid var(--hp-card-border);
    }

    .hero-feature { text-align: center; padding: 0.5rem; }
    .hero-feature i { font-size: 1.5rem; color: var(--hp-primary); margin-bottom: 0.25rem; display: block; }
    .hero-feature span { font-size: 0.8rem; color: var(--hp-text-muted); font-weight: 500; }

    @media (max-width: 768px) {
        .hero-title { font-size: 2rem; }
        .hero-card { margin: 1rem; padding: 1rem !important; }
        .hero-card .card-body { padding: 2rem 1.5rem !important; }
        .hero-features { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .hero-icon { width: 64px; height: 64px; }
        .hero-icon i { font-size: 2rem; }
    }

    @media (max-width: 480px) {
        .hero-features { grid-template-columns: 1fr; }
        .hero-title { font-size: 1.6rem; }
        .hero-subtitle { font-size: 0.95rem; }
        .btn-hero-primary, .btn-hero-secondary { padding: 0.7rem 1.5rem; font-size: 0.95rem; }
    }
</style>

<div class="hero-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card hero-card">
                    <div class="card-body p-5 text-center">
                        <div class="hero-icon"><i class="fas fa-stethoscope"></i></div>

                        <h1 class="hero-title">Medi<span>Logic</span></h1>

                        <p class="hero-subtitle">
                            Plateforme complète de gestion médicale pour les structures de santé
                        </p>

                        <div class="d-grid gap-3">
                            <a href="{{ url_for('login') }}" class="btn-hero-primary">
                                <i class="fas fa-sign-in-alt me-2"></i> Connexion
                            </a>
                            <a href="{{ url_for('register_structure') }}" class="btn-hero-secondary">
                                <i class="fas fa-building me-2"></i> Inscription structure
                            </a>
                        </div>

                        <div class="hero-features">
                            <div class="hero-feature"><i class="fas fa-users"></i><span>Gestion patients</span></div>
                            <div class="hero-feature"><i class="fas fa-stethoscope"></i><span>Consultations</span></div>
                            <div class="hero-feature"><i class="fas fa-flask"></i><span>Analyses & Radiologie</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
